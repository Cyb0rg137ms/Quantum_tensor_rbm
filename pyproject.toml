[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtensor-rbm"
version = "2.0.0"
description = "MPS/TEBD simulation of qudit chains, dense reference simulator, and RBM neural quantum states"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cyb0rg137ms" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout", "ruff", "mypy"]

[project.scripts]
qtensor = "qtensor.cli:main"

[tool.setuptools.packages.find]
include = ["qtensor*", "simulator*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

ignore = ["E731", "RUF001", "RUF002", "RUF003", "B023", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E501", "RUF059"]
"simulator/*" = ["UP", "E501", "SIM", "RUF", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=300"
filterwarnings = ["ignore::DeprecationWarning"]
